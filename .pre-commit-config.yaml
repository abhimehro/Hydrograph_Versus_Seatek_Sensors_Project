repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v4.5.0
  hooks:
  - id: trailing-whitespace
  - id: end-of-file-fixer
  - id: check-yaml
    exclude: ^\.devin/blueprint\.yaml$
  # Blueprint is intentionally multi-document; everything else stays strict.
  - id: check-yaml
    alias: check-yaml-blueprint
    args: [--allow-multiple-documents]
    files: ^\.devin/blueprint\.yaml$
  - id: check-added-large-files
  - id: check-ast
  - id: check-json
  - id: check-merge-conflict
  - id: detect-private-key
- repo: https://github.com/psf/black
  rev: 26.5.1
  hooks:
  - id: black
    language_version: python3
- repo: https://github.com/PyCQA/flake8
  rev: 7.3.0
  hooks:
  - id: flake8
    additional_dependencies:
    - flake8-docstrings
- repo: https://github.com/pre-commit/mirrors-mypy
  rev: v2.4.0
  hooks:
  - id: mypy
    additional_dependencies:
    - types-PyYAML
    exclude: ^(tests/|\.github/scripts/|.*test.*\.py|validate_data\.py)
- repo: https://github.com/pycqa/isort
  rev: 5.13.2
  hooks:
  - id: isort
    args:
    - --profile
    - black
# No nbQA: this repo has zero notebooks.
