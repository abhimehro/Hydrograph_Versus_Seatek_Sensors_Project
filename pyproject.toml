[tool.poetry]
name = "hydrograph-seatek-analysis"
version = "1.0.0"
description = "Analysis of hydrograph and Seatek sensor data for river morphology studies"
authors = ["Abhi Mehrotra <abhimhrtr@pm.me>"]
readme = "README.md"
packages = [{ include = "src" }]
include = [{ path = "validate_data.py", format = ["sdist", "wheel"] }]

[tool.poetry.dependencies]
python = "^3.12"
numpy = "==2.5.1"
pandas = "==2.3.3"
matplotlib = "==3.11.1"
# Explicit floor: Pillow 12.2.0 (matplotlib transitive) has OSV issues fixed in 12.3.0
pillow = "==12.3.0"
seaborn = "==0.13.2"
openpyxl = "==3.1.5"
colorlog = "==6.12.0"
pyyaml = "==6.0.3"
defusedxml = "==0.7.1"

[tool.poetry.group.dev.dependencies]
pytest = "==9.1.1"
pytest-cov = "==7.1.0"
black = "==26.5.1"
flake8 = "==7.3.0"
mypy = "==2.3.0"
pre-commit = "==4.6.1"
bandit = "==1.9.4"
pytest-mock = "==3.15.1"
pandas-stubs = "==3.0.3.260530"
types-seaborn = "==0.13.2.20260728"
types-defusedxml = "==0.7.0.20260504"

[tool.poetry.group.docs.dependencies]
scipy = "==1.18.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
seatek-processor = "src.hydrograph_seatek_analysis.app:main"
validate-data = "validate_data:main"

[tool.black]
line-length = 88
target-version = ['py312']

[tool.mypy]
exclude = ["^tests/", "^\\.github/scripts/"]
explicit_package_bases = true
mypy_path = "."
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -q"
norecursedirs = []
